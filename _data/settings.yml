#-------------------------------
# Site Settings
title: Rosalyn
description: "Senior Mobile Developer | Android + Flutter | Native & Cross-Platform Specialist"
logo: '/images/logo.svg' # You can add own logo. For example '/images/logo.png'.
logo_dark: '/images/logo-dark.svg'
color_scheme: auto # You can choose three modes auto, light, and dark. By default, the auto mode is set, which means the user can choose the light or dark mode themself.


#-------------------------------
# Navigation Settings
menu_settings:
  menu_items:
    - title: 'Home'
      url: '/'
    - title: 'Projects'
      url: '/projects/'
    - title: 'Blog'
      url: '/posts/'
    - title: 'Resources'
      submenu:
      - url: '/about/'
        title: 'About'
      - url: '/videos/'
        title: 'Videos'
      - url: '/archive/'
        title: 'Archive'
      - url: '/elements/'
        title: 'Elements'
      - url: '/latest/'
        title: 'Latest'
      - url: '/services/'
        title: 'Services'
      - url: '/faq/'
        title: 'FAQ'

# Call to action button
cta_button:
  enable: true
  cta_button_link: '/contact/'
  cta_button_text: Contact


# Home Cover Image
home_cover_image: /images/bg.png


#-------------------------------
# Author Settings
author:
  author_name: Rosalyn Blanco
  author_avatar: /images/authorimage.jpg


#-------------------------------
# Hero Settings
hero:
  enable: true
  hero_avatar: /images/authorimage.jpg
  hero_title: Rosalyn Blanco
  hero_description: Hey friends 👋 I’m Rosalyn, Senior Software Engineer at <a href="https://play2pay.com/">Play2Pay</a>. I’ve previously worked with teams at <a href="#">Redzone Map</a> and <a href="https://xsalesmobility.com/">XSales</a>. I focus on turning ideas into polished, high-quality apps that create meaningful experiences for users.

